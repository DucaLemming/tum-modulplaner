name: TUMonline access test

# Runs only when you start it by hand (Actions tab > TUMonline access test > Run workflow).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Where does this runner sit?
        run: curl -s https://ipinfo.io/json || true
      - name: Run the test (no login, plain HTTP)
        run: python test_tumonline.py --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tum-test-results
          path: results/
