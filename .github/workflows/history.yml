name: History scrape (one-off)

on:
  workflow_dispatch:   # manual only; already ran on 14.11.2026, result in data/history.json

permissions:
  contents: write

concurrency:
  group: modulplaner-history
  cancel-in-progress: false

env:
  LIMIT: "0"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Scrape past semesters (read-only, no login)
        run: python scripts/history_scrape.py --planner planner/TUM_Modulplaner.html --out data/history${{ env.LIMIT != '0' && '_test' || '' }}.json --limit ${{ env.LIMIT }}
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet && exit 0
          git commit -m "History scrape $(date -u +%Y-%m-%d) (limit ${{ env.LIMIT }})"
          git pull -q --rebase origin main
          git push
